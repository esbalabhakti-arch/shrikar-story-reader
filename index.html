<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shrikar Story Reader</title>

    <!-- Connect our CSS -->
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <main>

        <h1>📚 Shrikar Story Reader</h1>

        <p>
            Read a story, remember what happened,
            and connect the story as you go.
        </p>

        <hr>

        <!-- =====================================
             BOOK UPLOAD
        ====================================== -->

        <h2>Choose a Book</h2>

        <p>
            Upload a prepared story file to begin reading.
        </p>

        <input
            type="file"
            id="bookFile"
            accept=".json"
        >

        <br><br>

        <button id="loadBookButton">
            📖 Read This Book
        </button>

        <p id="statusMessage"></p>


        <!-- =====================================
             READING SCREEN
        ====================================== -->

        <section id="readingScreen" style="display: none;">

            <hr>

            <h2 id="bookTitle"></h2>


            <!-- STORY SO FAR -->

            <div id="storySoFarBox" style="display: none;">

                <h3>🔗 Story So Far</h3>

                <p id="storySoFarText"></p>

            </div>


            <!-- NEW STORY SECTION -->

            <div id="storySection">

                <h3>📖 Keep Reading</h3>

                <div id="storyLines"></div>

            </div>


            <!-- NAVIGATION -->

            <button id="nextButton">
                Next →
            </button>

        </section>


        <!-- =====================================
             STORY REVIEW SCREEN
        ====================================== -->

        <section id="reviewScreen" style="display: none;">

            <hr>

            <div id="reviewCard">

                <div class="review-label">
                    ⭐ STORY REVIEW
                </div>

                <h2>
                    Let's Connect the Story
                </h2>

                <p class="review-intro">
                    Look back at the important ideas you have read.
                </p>

                <div id="reviewQuestions"></div>

                <button id="continueStoryButton">
                    Continue Story →
                </button>

            </div>

        </section>

    </main>


    <!-- Connect our JavaScript -->
    <script src="js/app.js?v=3"></script>

</body>

</html>
